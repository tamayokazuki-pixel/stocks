# Render Blueprint — https://dashboard.render.com → New → Blueprint → select this repo.
# The web service runs the Express API and web app; data is stored in Supabase PostgreSQL.
services:
  - type: web
    name: northstar
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # paste the Supabase PostgreSQL URI in the Render dashboard
      - key: DEMO_MODE
        value: "false" # leave off for public deployments
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional extras:
      # - key: FINNHUB_API_KEY
      #   sync: false
      # - key: MARKET_PROVIDER
      #   value: auto
