# Fly.io config — https://fly.io
# 1. fly auth login
# 2. Edit `app` below to a globally unique name
# 3. fly launch --no-deploy
# 4. Set secrets: fly secrets set DATABASE_URL='postgresql://...' ADMIN_EMAIL=... ADMIN_PASSWORD=...
# 5. Apply supabase/schema.sql in Supabase SQL Editor, then deploy: fly deploy && fly open

app = "northstar" # CHANGE ME — must be globally unique on fly.io
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Keep one machine for now: price polling and SSE client state are in-process.
# PostgreSQL can be shared, but market updates are not yet coordinated across replicas.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
